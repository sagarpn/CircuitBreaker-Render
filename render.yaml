services:
  - type: web
    name: circuitbreaker
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: circuitbreaker-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: circuitbreaker-db
    plan: free
    databaseName: circuitbreaker
    user: circuitbreaker
